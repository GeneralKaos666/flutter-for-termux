[flutter]
tag = '3.47.9'
repo = 'https://github.com/flutter/flutter'
path = './flutter'
dart_version = '3.13.7'
framework_revision = 'c197ca5199e9ee5661e865596c9c07294dfab51c'
framework_commit_date = '2026-10-29 07:10:20 -0700'
devtools_version = '2.60.0'

[ndk]
api = 26 # >=26
version = '30.0.14206865' # r30 from HomuHomu833
# unset to use ANDROID_NDK from env
# path = 'path/to/ndk'

[build]
arch = ['arm64']       # arm, arm64, x86, x64
runtime = ['release']  # debug, release, profile; the deb packages only these modes' artifacts
# Android-target gen_snapshot modes. `flutter build apk --release/--profile`
# AOT-compiles Dart with an Android-configured gen_snapshot (compressed
# pointers, target_os=android); the Linux desktop gen_snapshot cannot be reused
# for Android. Only AOT modes matter here (debug is JIT, no gen_snapshot).
android_runtime = ['release', 'profile']
gclient = './.gclient'

[android]
compile_sdk = 36   # Stage-B ladder: 36 > 35 > 34; TERMUX_COMPILE_SDK overrides at runtime on-device
target_sdk  = 36

[installer]
java     = 'openjdk-21'  # single JDK; openjdk-25 available as future bump
zip_tool = '7zip'        # 26.03 (was p7zip)

[patch.engine]
file = './patches/engine.patch'
path = '.'

[patch.dart]
file = './patches/dart.patch'
path = 'engine/src/flutter/third_party/dart'

[patch.skia]
file = './patches/skia.patch'
path = 'engine/src/flutter/third_party/skia'

[sysroot]
path = './sysroot'

[sysroot.termux-main]
repo = 'https://packages-cf.termux.dev/apt/termux-main/'
dist = 'stable'
pkgs = [
  'at-spi2-core',
  'brotli',
  'dbus',
  'fontconfig',
  'freetype',
  'fribidi',
  'gdk-pixbuf',
  'glib',
  'harfbuzz',
  'libcairo',
  'libepoxy',
  'libexpat',
  'libffi',
  'libglvnd',
  'libgraphite',
  'libjpeg-turbo',
  'liblzma',
  'libpixman',
  'libpng',
  'libtiff',
  'libwayland',
  'libx11',
  'libxau',
  'libxcb',
  'libxcursor',
  'libxdmcp',
  'libxext',
  'libxfixes',
  'libxft',
  'libxi',
  'libxrandr',
  'libxrender',
  'libxtst',
  'pango',
  'pcre2',
  'swiftshader',
  'xorgproto',
  'zlib',
  'zstd',
]

[sysroot.termux-x11]
repo = 'https://packages-cf.termux.dev/apt/termux-x11/'
dist = 'x11'
pkgs = ['gtk3', 'libxcomposite', 'libxdamage', 'libxinerama', 'libxkbcommon']

[package]
conf = './package.yaml'
path = 'release'  # gitignored; created on demand by Build.output()
pkg_rel = '7'  # Debian packaging revision suffix (3.47.7-6 adds the opt-in `post_install.sh --provision-ndk` NDK provisioning for the apt path; 3.47.7-5 shipped the review-fix batch: newline-free engine version, valid flutter_settings JSON, honest snapshot banners, non-interactive --yes, flutter_project_config in the deb, deb under release/)
