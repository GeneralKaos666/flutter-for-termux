name: build

on:
  workflow_dispatch:
jobs:
  Ubuntu:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v7

    - name: install deps
      run: |
        sudo apt update
        sudo apt install -y \
          libfreetype-dev \
          libfontconfig1-dev \
          ninja-build

    - name: setup depot-tools
      uses: newkdev/setup-depot-tools@v1.0.1

    - name: install python requirements
      run: pip install -r requirements.txt

    - name: detect Android NDK
      run: |
        if [ -n "$ANDROID_NDK" ]; then
          echo "ANDROID_NDK=$ANDROID_NDK" >> "$GITHUB_ENV"
        elif [ -n "$ANDROID_NDK_LATEST_HOME" ]; then
          echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
        elif [ -n "$ANDROID_NDK_HOME" ]; then
          echo "ANDROID_NDK=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
        else
          echo "Android NDK not found on runner" >&2
          exit 1
        fi

    - name: build
      run: python build.py

    - name: parse tag
      id: parser
      run: |
        TAG=$(NO_RECORD=1 python build.py tag)
        echo "TAG=$TAG" >> $GITHUB_OUTPUT
        echo "TITLE=Flutter $TAG" >> $GITHUB_OUTPUT

    - name: last commit message
      id: commitmsg
      run: |
        MSG=$(git log -1 --format=%B)
        echo "BODY<<EOF" >> "$GITHUB_OUTPUT"
        echo "$MSG" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

    - name: release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.parser.outputs.TAG }}
        name: ${{ steps.parser.outputs.TITLE }}
        body: ${{ steps.commitmsg.outputs.BODY }}
        files: '**/*.deb'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
