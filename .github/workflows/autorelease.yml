name: autorelease

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: autorelease
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Detect latest Flutter stable tag
        id: detect
        run: |
          set -euo pipefail
          STABLE=$(git ls-remote --tags https://github.com/flutter/flutter.git \
            | grep -E 'refs/tags/[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v '\^{}' \
            | cut -f2 \
            | sed 's|refs/tags/||' \
            | sort -V | tail -1)
          if [ -z "$STABLE" ]; then
            echo "could not determine latest Flutter stable tag" >&2
            git ls-remote --tags https://github.com/flutter/flutter.git | grep -E 'refs/tags/[0-9]' | head -n 20 >&2 || true
            exit 1
          fi
          echo "latest Flutter stable tag: $STABLE"
          echo "TAG=$STABLE" >> "$GITHUB_OUTPUT"

      - name: Read current metadata from build.toml
        id: current
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open('build.toml', 'rb') as f:
              cfg = tomllib.load(f)
          flutter = cfg['flutter']
          for key in ('tag', 'dart_version', 'framework_revision', 'framework_commit_date', 'devtools_version'):
              if key == 'tag':
                  tag = flutter.get('tag', '')
                  print(f'TAG={tag}')
                  print(f'OLD_TAG={tag}')
              else:
                  print(f"OLD_{key.upper()}={flutter.get(key, '')}")
          PY

      - name: Skip if nothing to release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.detect.outputs.TAG }}" = "${{ steps.current.outputs.TAG }}" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "build.toml already at latest (${{ steps.detect.outputs.TAG }}), nothing to do."
            exit 0
          fi
          if gh api "repos/${{ github.repository }}/git/refs/tags/${{ steps.detect.outputs.TAG }}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "tag ${{ steps.detect.outputs.TAG }} already released, nothing to do."
            exit 0
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "new Flutter release detected: ${{ steps.current.outputs.TAG }} -> ${{ steps.detect.outputs.TAG }}"

      - name: Fetch new release metadata
        id: meta
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - "${{ steps.detect.outputs.TAG }}" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          import urllib.request
          from datetime import datetime, timedelta, timezone

          tag = sys.argv[1]
          with urllib.request.urlopen(
              "https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json"
          ) as resp:
              rel = json.load(resp)
          entries = [r for r in rel["releases"] if r.get("version") == tag]
          if not entries:
              raise SystemExit(f"no stable release entry for {tag} in releases_linux.json")
          entry = entries[0]
          rev = entry["hash"]
          dart = entry.get("dart_sdk_version", "")
          if not dart:
              raise SystemExit(f"dart_sdk_version missing for {tag} in releases_linux.json")
          with urllib.request.urlopen(
              f"https://api.github.com/repos/flutter/flutter/commits/{rev}"
          ) as resp:
              commit = json.load(resp)
          iso = commit["commit"]["committer"]["date"].replace("Z", "+00:00")
          dt = datetime.fromisoformat(iso).astimezone(timezone(timedelta(hours=-7)))
          print(f"NEW_REV={rev}")
          print(f"NEW_DART={dart}")
          print(f"NEW_DATE={dt:%Y-%m-%d %H:%M:%S %z}")
          PY

      - name: Bump build.toml
        if: steps.check.outputs.should_release == 'true'
        run: |
          sed -i "s/^tag = .*/tag = '${{ steps.detect.outputs.TAG }}'/" build.toml
          git diff -- build.toml

      - name: Sync version references across all files
        if: steps.check.outputs.should_release == 'true'
        env:
          OLD_TAG: ${{ steps.current.outputs.OLD_TAG }}
          NEW_TAG: ${{ steps.detect.outputs.TAG }}
          OLD_DART: ${{ steps.current.outputs.OLD_DART_VERSION }}
          NEW_DART: ${{ steps.meta.outputs.NEW_DART }}
          OLD_REV: ${{ steps.current.outputs.OLD_FRAMEWORK_REVISION }}
          NEW_REV: ${{ steps.meta.outputs.NEW_REV }}
          OLD_DATE: ${{ steps.current.outputs.OLD_FRAMEWORK_COMMIT_DATE }}
          NEW_DATE: ${{ steps.meta.outputs.NEW_DATE }}
        run: |
          set -euo pipefail
          FILES=(
            AGENTS.md README.md
            docs/CI_CD.md docs/releases/RELEASE_NOTES.md
            docs/guides/BUILD_GUIDE.md
            docs/guides/BUILD_PROCESS.md
            docs/guides/INSTALL_GUIDE.md
            docs/guides/UPGRADE_GUIDE.md
            install_flutter_complete.sh
            scripts/ci/check_repo.py
            scripts/device/run_termux_smoke.ps1
            scripts/install/flutter_termux_doctor.sh
            scripts/install/install.sh
            scripts/install/install_termux_flutter.sh
            scripts/install/lib_common.sh
            scripts/install/post_install.sh
            scripts/install/versions_common.sh
            scripts/test/gh_e2e_test.sh
          )
          bump() {
            local old="$1" new="$2" field="$3"
            if [ -z "$old" ] || [ -z "$new" ] || [ "$old" = "$new" ]; then
              return
            fi
            # Escape sed regex chars in $old (dots in versions, etc.)
            local old_esc
            old_esc=$(printf '%s' "$old" | sed -e 's/[][\/.^$*+?{}()|]/\\&/g')
            for f in "${FILES[@]}"; do
              [ -f "$f" ] && sed -i "s/${old_esc}/${new}/g" "$f"
            done
            [ -n "$field" ] && sed -i "s/^${field} = .*/${field} = '${new}'/" build.toml
          }
          bump "$OLD_TAG" "$NEW_TAG" tag
          bump "$OLD_DART" "$NEW_DART" dart_version
          bump "$OLD_REV" "$NEW_REV" framework_revision
          bump "$OLD_DATE" "$NEW_DATE" framework_commit_date
          git diff --stat
          git diff --check

      - name: Verify version sync before pushing
        if: steps.check.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          pip install -q -r requirements.txt
          python3 scripts/ci/check_version_drift.py --fix
          python3 scripts/ci/check_repo.py
          git diff --stat
          git diff --check

      - name: Commit and push bump
        if: steps.check.outputs.should_release == 'true'
        id: commit
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "BOT_TOKEN secret not set" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update build.toml to ${{ steps.detect.outputs.TAG }}"
          git push "https://x-access-token:${BOT_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
