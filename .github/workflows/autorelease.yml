name: autorelease

on:
  schedule:
    - cron: '0 8 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: autorelease
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect latest Flutter stable tag
        id: detect
        run: |
          TAGS=$(curl -sS "https://api.github.com/repos/flutter/flutter/tags?per_page=20")
          STABLE=$(echo "$TAGS" | grep -oP '"name":\s*"\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$STABLE" ]; then
            echo "could not determine latest Flutter stable tag" >&2
            exit 1
          fi
          echo "latest Flutter stable tag: $STABLE"
          echo "TAG=$STABLE" >> "$GITHUB_OUTPUT"

      - name: Read current tag from build.toml
        id: current
        run: |
          TAG=$(python3 -c "
          import tomllib
          with open('build.toml', 'rb') as f:
              cfg = tomllib.load(f)
          print(cfg['flutter']['tag'])
          ")
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Skip if nothing to release
        run: |
          if [ "${{ steps.detect.outputs.TAG }}" = "${{ steps.current.outputs.TAG }}" ]; then
            echo "build.toml already at latest (${{ steps.detect.outputs.TAG }}), nothing to do."
            exit 0
          fi
          if gh api "repos/${{ github.repository }}/git/refs/tags/${{ steps.detect.outputs.TAG }}" >/dev/null 2>&1; then
            echo "tag ${{ steps.detect.outputs.TAG }} already released, nothing to do."
            exit 0
          fi
          echo "new Flutter release detected: ${{ steps.current.outputs.TAG }} -> ${{ steps.detect.outputs.TAG }}"

      - name: Bump build.toml
        run: |
          sed -i "s/^tag = .*/tag = '${{ steps.detect.outputs.TAG }}'/" build.toml
          git diff -- build.toml

      - name: Commit and push bump
        id: commit
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "BOT_TOKEN secret not set" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build.toml
          git commit -m "Update build.toml"
          git push "https://x-access-token:${BOT_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for validate.yml on bump commit
        env:
          SHA: ${{ steps.commit.outputs.SHA }}
        run: |
          DEADLINE=$(( $(date +%s) + 1800 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            RESULT=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SHA&event=push" \
              --jq '.workflow_runs[] | select(.name == "validate") | .status + " " + (.conclusion // "")' | head -1)
            if [ -n "$RESULT" ]; then
              STATUS=$(echo "$RESULT" | awk '{print $1}')
              CONCLUSION=$(echo "$RESULT" | awk '{print $2}')
              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" = "success" ]; then
                  echo "validate.yml passed on $SHA"
                  exit 0
                fi
                echo "validate.yml conclusion on $SHA: $CONCLUSION" >&2
                exit 1
              fi
            fi
            sleep 20
          done
          echo "timed out waiting for validate.yml on $SHA" >&2
          exit 1

      - name: Dispatch build
        run: gh workflow run build.yml --ref main