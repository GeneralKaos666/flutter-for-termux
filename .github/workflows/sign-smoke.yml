name: sign-smoke

# Temporary verification workflow: proves the GPG_PRIVATE_KEY secret imports
# and produces a GitHub-verified commit. Remove once the nightly autorelease
# has signed a real bump.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Import CI signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "GPG_PRIVATE_KEY secret not set" >&2
            exit 1
          fi
          install -m 700 -d "$HOME/.gnupg"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')"
          if [ -z "$KEY_ID" ]; then
            echo "No secret key imported" >&2
            exit 1
          fi
          echo "GPG_KEY_ID=${KEY_ID}" >> "$GITHUB_ENV"

      - name: Commit and push signed
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "GeneralKaos666"
          git config user.email "xkiller1177@gmail.com"
          git config user.signingkey "$GPG_KEY_ID"
          git config commit.gpgsign true
          git checkout -B sign-smoke
          git commit -S --allow-empty -m "chore: sign-smoke probe"
          git verify-commit HEAD
          git push --force "https://x-access-token:${BOT_TOKEN}@github.com/${{ github.repository }}.git" HEAD:sign-smoke
          echo "PROBE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
