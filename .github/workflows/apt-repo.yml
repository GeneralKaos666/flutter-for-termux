name: apt-repo

on:
  workflow_run:                # build.yml publishes with the repository
    workflows: ['build']       # GITHUB_TOKEN, which suppresses `release:`
    types: [completed]         # events; workflow_run is the proven chain
    branches: [main]           # (build itself chains off CI the same way)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apt-repo
  cancel-in-progress: false

jobs:
  build:
    name: Build apt site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.guard.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Release guard
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          VERSION=$(python3 -c "import tomllib;c=tomllib.load(open('build.toml','rb'));t=c['flutter']['tag'];p=str(c['package'].get('pkg_rel') or '').strip();print(f'{t}-{p}' if p else t)")
          TAG=${VERSION%-*}
          if gh release view "$TAG" --json assets 2>/dev/null \
            | python3 -c "import json,sys;a={x['name'] for x in json.load(sys.stdin)['assets']};sys.exit(0 if 'flutter_${VERSION}_aarch64.deb' in a else 1)"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No release carries flutter_${VERSION}_aarch64.deb; site not published."
          fi

      - name: Build stub deb
        if: steps.guard.outputs.publish == 'true'
        run: python3 scripts/release/apt_repo.py stub

      - name: Build and sign apt site
        if: steps.guard.outputs.publish == 'true'
        env:
          APT_REPO_SIGNING_KEY: ${{ secrets.APT_REPO_SIGNING_KEY }}
          APT_REPO_SIGNING_PASSPHRASE: ${{ secrets.APT_REPO_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          printf '%s' "$APT_REPO_SIGNING_KEY" | gpg --batch --import
          python3 scripts/release/apt_repo.py repo

      - name: Upload Pages artifact
        if: steps.guard.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: repo

  deploy:
    name: Deploy to Pages
    needs: build
    if: needs.build.outputs.publish == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v5
